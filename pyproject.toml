[project]
name = "ragqa"
version = "0.1.0"
description = "A QA-focused RAG microservice and test bench for keyword vectorisation."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[tool.uv.workspace]
members = ["packages/core", "apps/api"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest==9.1.*",
  "ruff==0.17.*",
  "pyright==1.1.414",
  "httpx==0.28.*",
  "ragqa-core",
  "ragqa-api",
]

[tool.uv.sources]
ragqa-core = { workspace = true }
ragqa-api = { workspace = true }

[tool.pytest.ini_options]
markers = ["integration: needs Docker or model downloads"]
testpaths = ["tests", "packages/core/tests", "apps/api/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["packages/core/src", "apps/api/src"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["ragqa_core", "ragqa_api"]
