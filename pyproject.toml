[project]
name = "ragqa"
version = "0.1.0"
description = "A QA-focused RAG microservice and test bench for keyword vectorisation."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[tool.uv.workspace]
members = ["packages/aiconnect", "packages/core", "apps/api", "apps/worker"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest==9.1.*",
  "ruff==0.17.*",
  "pyright==1.1.414",
  "httpx==0.28.*",
  "aiconnect",
  "ragqa-core",
  "ragqa-api",
  "ragqa-worker",
  "playwright==1.64.*",
  "pytest-playwright==0.10.*",
]

[tool.uv.sources]
aiconnect = { workspace = true }
ragqa-core = { workspace = true }
ragqa-api = { workspace = true }
ragqa-worker = { workspace = true }

[tool.pytest.ini_options]
markers = [
  "integration: needs Docker or model downloads",
  "pages: drives a real browser against the console (Playwright)",
]
testpaths = ["tests", "packages/aiconnect/tests", "packages/core/tests", "apps/api/tests", "apps/worker/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["packages/aiconnect/src", "packages/core/src", "apps/api/src", "apps/worker/src"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["aiconnect", "ragqa_core", "ragqa_api", "ragqa_worker"]
