[project]
name = "aiconnect"
version = "0.1.0"
description = "Stored AI provider connections, models, roles and a spend cap, behind one class."
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic==2.1.*",
  "openai==3.29.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiconnect"]
