[project]
name = "ragqa-core"
version = "0.3.0"
description = "Retrieval, keyword vectorisation and evaluation for keyword-rag."
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiconnect",
  "fastembed==0.9.*",
  "qdrant-client==1.20.*",
  "numpy==2.5.*",
  "pyarrow==26.*",
  "huggingface-hub==1.33.*",
  "httpx==0.28.*",
]

[tool.uv.sources]
aiconnect = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragqa_core"]
