[project]
name = "ragqa-core"
version = "0.1.0"
description = "Retrieval, keyword vectorisation, Claude cost control and evaluation for rag-qa."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed==0.9.*",
  "qdrant-client==1.20.*",
  "anthropic==2.1.*",
  "numpy==2.5.*",
  "pyarrow==26.*",
  "huggingface-hub",
  "httpx==0.28.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragqa_core"]
