<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-qa · Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/ui.css">
<style>
  form { display:grid; gap:10px; margin:0 0 16px; max-width:900px; }
  textarea { min-height:70px; }
  .methods { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .methods label { display:flex; gap:4px; align-items:center; color:var(--fg); font-size:13px; }
  #results { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
  .col { border:1px solid var(--line); border-radius:8px; padding:10px; min-width:0; }
  .col h2 { font-size:14px; margin:0 0 6px; display:flex; justify-content:space-between; }
  .hit { background:var(--card); border-radius:6px; padding:8px; margin:6px 0; overflow-wrap:anywhere; }
  .hit .id { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; margin:2px 2px 0 0; border-radius:10px; border:1px solid var(--line); }
  .chip.on { background:var(--hl); border-color:transparent; }
  .answer { margin-top:6px; font-weight:600; }
</style>
</head>
<body>
<aside id="side"></aside>
<main id="main">
  <div id="head"></div>

  <form id="form">
    <div class="row">
      <label>Collection <select id="collection" required></select></label>
      <label title="How many items each method retrieves; runs use 5">Items per method (k) <input id="k" type="number" value="5" min="1" max="20" style="width:70px"></label>
      <label title="When methods merge their rankings, a higher value lets lower-ranked items count for more; 60 is the usual">Merge constant (rrf_k) <input id="rrfk" type="number" value="60" min="0" style="width:80px"></label>
    </div>
    <label>Question <textarea id="question" required></textarea></label>
    <label>Choices, one per line (multiple choice only) <textarea id="choices" style="min-height:50px"></textarea></label>
    <fieldset><legend>Methods</legend><div class="methods" id="methods"></div></fieldset>
    <div class="row">
      <label style="flex-direction:row;display:flex;gap:6px;color:var(--fg)"><input id="answer" type="checkbox"> Have the AI answer the question <span class="cost muted">costs money</span></label>
      <label>Model <select id="model"></select></label>
      <button id="run">Run</button>
      <span id="status" class="muted" role="status"></span>
    </div>
  </form>

  <div id="results"></div>
</main>
<script type="module" src="/static/lab.js"></script>
</body>
</html>
