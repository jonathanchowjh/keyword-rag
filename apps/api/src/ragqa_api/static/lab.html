<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keyword-rag · Lab</title>
<link rel="icon" href="data:,">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/ui.css">
</head>
<body class="page-lab">
<aside id="side"></aside>
<main id="main">
  <div id="head"></div>

  <form id="form">
    <div class="row">
      <label>Store <select id="collection" required></select></label>
      <label title="How many items each method retrieves; runs use 5, and a Documents answer reads at least Settings' evidence size">Items per method (k) <input id="k" class="w70" type="number" value="5" min="1" max="50"></label>
      <label title="When methods merge their rankings, a higher value lets lower-ranked items count for more; 60 is the usual">Merge constant (rrf_k) <input id="rrfk" class="w80" type="number" value="60" min="0"></label>
    </div>
    <label>Question <textarea id="question" required></textarea></label>
    <label id="choices-row">Choices, one per line (multiple choice only) <textarea id="choices" class="short"></textarea></label>
    <fieldset><legend>Methods</legend><div class="methods" id="methods"></div></fieldset>
    <div class="row">
      <label class="ask-ai"><input id="answer" type="checkbox"> Have the AI answer the question <span class="cost muted">costs money</span></label>
      <label>Model <select id="model"></select></label>
      <button id="run">Run</button>
      <span id="status" class="muted" role="status"></span>
    </div>
  </form>

  <div id="results"></div>
</main>
<script type="module" src="/static/lab.js"></script>
</body>
</html>
