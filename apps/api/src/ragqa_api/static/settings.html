<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-qa · Settings</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/ui.css">
<style>
  .conn { display:grid; gap:8px; }
  .conn .top { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; }
  .conn .top strong { font-size:14px; }
  .conn .keyline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .conn .keyline input { width:16rem; }
  .price { width:6rem; }
  .model { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:6px 0;
    border-top:1px solid var(--line); }
  .model .name { flex:1 1 14rem; min-width:0; overflow-wrap:anywhere; }
  .model label { display:flex; flex-direction:row; align-items:center; gap:6px; }
  .jobs { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; max-width:900px; }
  .result { font-size:12px; }
</style>
</head>
<body>
<aside id="side"></aside>
<main id="main">
  <div id="head"></div>
  <p id="msg" class="err" role="status"></p>

  <h2>Connections</h2>
  <div id="connections"></div>
  <form id="add" class="card form">
    <div class="row">
      <label>Preset <select id="add-preset"></select></label>
      <label>Id <input id="add-id" required pattern="[a-z0-9][a-z0-9_\-]*" title="Lowercase letters, digits, - and _"></label>
      <label>Name <input id="add-label"></label>
    </div>
    <div class="row">
      <label>Base URL <input id="add-url" type="url" style="width:22rem"></label>
      <label>Key <input id="add-key" type="password" autocomplete="off"></label>
    </div>
    <div class="row"><button id="add-go">Add connection</button></div>
  </form>

  <h2>Models</h2>
  <p class="muted">Prices are US dollars per million tokens. A model with no price is never used.</p>
  <div id="models"></div>

  <h2>Jobs</h2>
  <p class="muted">Which model each job uses. Only enabled, priced models are listed.</p>
  <div id="roles" class="jobs"></div>

  <h2>Budget</h2>
  <form id="budget" class="row">
    <label>Monthly cap, US dollars <input id="cap" type="number" min="0" step="0.01" style="width:9rem"></label>
    <button id="cap-go">Save</button>
    <span id="spent" class="muted"></span>
  </form>
</main>
<script type="module" src="/static/settings.js"></script>
</body>
</html>
