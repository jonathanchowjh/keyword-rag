<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keyword-rag · Store</title>
<link rel="icon" href="data:,">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<aside id="side"></aside>
<main id="main">
  <div id="head"></div>
  <div class="actions"><button type="button" id="chat-store" disabled>Chat with this store</button> <span id="chat-store-why" class="muted"></span><span id="chat-store-msg" class="err" role="status"></span></div>
  <div id="sec-answer">
  <h2>What's the answer?</h2>
  <div id="answer"></div>
  <h2>Runs</h2>
  <div class="actions"><button type="button" id="new-run" disabled>+ New run</button> <span id="new-run-why" class="muted"></span></div>
  <div id="run-form" hidden></div>
  <div id="runs" class="scroll"></div>
  </div>
  <h2>What's in it?</h2>
  <div id="items"></div>
  <div id="sources" class="scroll"></div>
  <div id="sources-confirm"></div><p id="sources-msg" class="err" role="status"></p>
  <div id="sec-import">
  <h3 id="imp-title">Add your own items</h3>
  <div id="imp-items"></div>
  </div>
  <div id="benchmark"></div>
  <h2>Eval set</h2>
  <div id="asked"></div>
  <div id="lists-section">
    <h2>How are items described?</h2>
    <div id="lists"></div>
  </div>
  <div id="tags"></div>
  <div id="tags-confirm"></div><p id="tags-msg" class="err" role="status"></p>
  <h2>Embedding model</h2>
  <div id="embedding"></div>
  <div id="embedding-confirm"></div><p id="embedding-msg" class="err" role="status"></p>
  <h2>Chat settings</h2>
  <div id="chat-settings"></div>
  <h2>Delete this store</h2>
  <div id="delete"></div>
</main>
<script type="module" src="/static/collection.js"></script>
</body>
</html>
