<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-qa · Chat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/ui.css">
<style>
  #chat-page { display:grid; grid-template-columns:220px minmax(0, 1fr); gap:20px; align-items:start; }
  #chats { display:grid; gap:8px; }
  #chat-list { list-style:none; margin:0; padding:0; display:grid; gap:2px; }
  #chat-list li { display:flex; gap:4px; align-items:start; border-radius:6px; }
  #chat-list li.active { background:var(--card); }
  #chat-list a { flex:1; min-width:0; display:grid; padding:5px 8px; text-decoration:none; overflow-wrap:anywhere; }
  #chat-list li.active a { font-weight:600; }
  #chat-list .stores { color:var(--muted); font-size:12px; font-weight:normal; }
  #chat-list button { padding:2px 8px; font-size:12px; margin:4px 4px 0 0; }
  #picking .checks { display:grid; gap:4px; }
  #chat-head { display:grid; gap:10px; margin:0 0 12px; }
  #chat-head[hidden] { display:none; }
  #chat-title { margin:0; }
  #log { display:grid; gap:10px; max-width:820px; margin:0 0 14px; }
  .turn { display:grid; gap:10px; }
  .msg { border-radius:8px; padding:10px 12px; overflow-wrap:anywhere; }
  .user, .err { white-space:pre-wrap; }
  .user { background:var(--card); justify-self:end; max-width:85%; }
  .reply { border:1px solid var(--line); }
  .reply a.cite { text-decoration:none; font-size:12px; vertical-align:super; }
  .meta { margin-top:8px; font-size:12px; white-space:normal; }
  .sources { margin:8px 0 0; padding:0; list-style:none; font-size:13px; white-space:normal; }
  .sources li { border-top:1px solid var(--line); padding:6px 0; }
  .sources .what { color:var(--muted); font-size:12px; }
  .sources summary { cursor:pointer; }
  .sources .full { margin-top:4px; white-space:pre-wrap; }
  #compose { display:grid; gap:8px; max-width:820px; }
  #box { min-height:60px; }
  .spoken { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  @media (max-width: 768px) { #chat-page { grid-template-columns:minmax(0, 1fr); } }
</style>
</head>
<body>
<aside id="side"></aside>
<main id="main">
  <div id="head"></div>
  <div id="chat-page">
    <nav id="chats" aria-label="Saved chats">
      <button id="new" type="button">New chat</button>
      <div id="picking"></div>
      <ul id="chat-list"></ul>
      <div id="deleting"></div>
    </nav>

    <section id="convo">
      <p id="empty" class="muted">Start a new chat, or open one from the list.</p>
      <div id="chat-head" hidden>
        <h2 id="chat-title"></h2>
        <div class="row">
          <div id="chips" class="chips"></div>
          <select id="add-store" aria-label="Add a store"></select>
        </div>
        <div class="row">
          <label>Evidence size <input id="evidence" type="number" min="1" max="20" step="1"></label>
          <span><label class="check"><input id="rewrite" type="checkbox"> Rewrite follow-ups with AI</label>
            <span class="muted">costs one AI call per follow-up</span></span>
          <label>Model <select id="model"></select></label>
        </div>
        <div class="row">
          <label>Add to <select id="doc-store"></select></label>
          <button id="add-doc" type="button" class="secondary">Add document</button>
          <input id="doc-file" type="file" accept=".txt,.md" multiple hidden>
        </div>
      </div>
      <p id="note" class="muted" role="status"></p>

      <div id="adding" class="muted" aria-live="polite"></div>
      <div id="log"></div>
      <div id="spoken" class="spoken" aria-live="polite"></div><!-- the newest reply, for screen readers: the log redraws whole -->

      <form id="compose">
        <label>Message <textarea id="box" placeholder="Ask this chat's stores. Enter sends, Shift+Enter adds a line."></textarea></label>
        <div class="row"><button id="send">Send</button><span id="status" class="muted" role="status"></span></div>
      </form>
    </section>
  </div>
</main>
<script type="module" src="/static/chat.js"></script>
</body>
</html>
