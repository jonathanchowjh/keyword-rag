[project]
name = "ragqa-worker"
version = "0.1.0"
description = "The rag-qa job-queue worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ragqa-core",
]

[tool.uv.sources]
ragqa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragqa_worker"]
